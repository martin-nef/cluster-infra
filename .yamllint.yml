# Config for yamllint, used by .github/workflows/yamllint.yml (and by running
# `yamllint <files>` locally). To exclude a file or directory add a pattern to
# `ignore`, one gitignore-style pattern per line.
extends: default

ignore: |
  # generated by `flux bootstrap`
  nefcloud/flux-system/gotk-*.yaml
  # SOPS-encrypted
  nefcloud/**/secret*.yaml
  # ansible-vault encrypted
  ansible/**/vault.yml

rules:
  document-start: disable
  line-length:
    max: 160
  truthy:
    check-keys: false  # `on:` in GitHub workflows
  indentation:
    spaces: consistent
    indent-sequences: consistent
