# Live game servers share these nodes. Sized for the runner plus one task at a
# time (MAX_CONCURRENT=1); a task pod's request is its largest step (the agent).
apiVersion: v1
kind: ResourceQuota
metadata:
  name: night-shift
  namespace: night-shift
spec:
  hard:
    requests.cpu: "1"
    requests.memory: 2Gi
    limits.cpu: "4"
    limits.memory: 5Gi
    requests.ephemeral-storage: 3Gi
    limits.ephemeral-storage: 10Gi
    pods: "3"
    # Running and finished (kept a day): a runner bug can't flood etcd.
    count/jobs.batch: "40"
    count/configmaps: "40"
    persistentvolumeclaims: "1"
    services: "0"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: night-shift
  namespace: night-shift
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 50m
        memory: 64Mi
        ephemeral-storage: 64Mi
      default:
        cpu: 500m
        memory: 512Mi
        ephemeral-storage: 512Mi
      max:
        cpu: "2"
        memory: 2Gi
        ephemeral-storage: 6Gi
