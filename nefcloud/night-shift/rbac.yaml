# The night shift is one pod a night (agent-harness deploy/cronjob.yaml): a
# coordinator that holds the GitHub App keys and the ledger, and a worker that
# runs the agent. The harness creates nothing in the cluster, so nothing here
# lets it: no Jobs, ConfigMaps, pods or logs of its own.
#
# The pod runs as `worker`, whose token only the worker container mounts
# (automountServiceAccountToken: false; a projected volume there). The agent
# works like the interactive agent: it reads the cluster as claude-remote does,
# to follow what it merged and investigate (pod logs included). It files
# flags and break-glass requests on the ops broker's API, not here.
# Read-only: no secrets, exec or writes.
# What it may merge is held by the ops broker's human-review check.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: worker
  namespace: night-shift
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: night-shift-worker-view
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: view
subjects:
  - kind: ServiceAccount
    name: worker
    namespace: night-shift
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: night-shift-worker-read
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: claude-remote-read  # nodes, CRDs, RBAC, metrics: what view leaves out (claude-remote/rbac.yaml)
subjects:
  - kind: ServiceAccount
    name: worker
    namespace: night-shift
---
# The account Flux impersonates to apply agent-harness's deploy/
# (spec.serviceAccountName of nefcloud/apps/night-shift.yaml): ConfigMaps,
# Secrets, the CronJob and the sessions PVC. No RBAC, NetworkPolicy, quota or
# Jobs, so a change to the app repo can't widen what the pod may do.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: night-shift-deployer
  namespace: flux-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: night-shift-deployer
  namespace: night-shift
rules:
  - apiGroups: [""]
    resources: [configmaps, secrets]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [batch]
    resources: [cronjobs]
    verbs: [get, list, watch, create, update, patch, delete]
  # The sessions PVC only: create can't name an object (the quota caps the
  # count), and the rest are limited to `sessions`, so a change to the app
  # repo can't touch or prune `state` (pvc.yaml), which holds the ledger.
  - apiGroups: [""]
    resources: [persistentvolumeclaims]
    verbs: [get, list, watch, create]
  - apiGroups: [""]
    resources: [persistentvolumeclaims]
    resourceNames: [sessions]
    verbs: [update, patch, delete]
  - apiGroups: [""]
    resources: [pods, events]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: night-shift-deployer
  namespace: night-shift
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: night-shift-deployer
subjects:
  - kind: ServiceAccount
    name: night-shift-deployer
    namespace: flux-system
