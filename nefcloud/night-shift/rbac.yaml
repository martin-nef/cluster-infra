# The runner starts each task as a Job (with a ConfigMap holding its task.json),
# waits for it, reads its pods' logs for the outcome, and cleans up. Task pods
# run as `worker` (below), whose token only the agent container mounts.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: runner
  namespace: night-shift
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: runner
  namespace: night-shift
rules:
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [create, get, list, delete]
  # create can't be limited to a name: any ConfigMap in this namespace. It
  # holds no secrets; the code ConfigMap is Flux's and is re-applied.
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [create, get, delete]
  - apiGroups: [""]
    resources: [pods]
    verbs: [list]
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: runner
  namespace: night-shift
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: runner
subjects:
  - kind: ServiceAccount
    name: runner
    namespace: night-shift
---
# The ops broker (nefcloud/ops-broker/): the runner and the worker file
# human-review flags and break-glass requests, and read the ones they wait on.
# File and read only; approval stays on the page behind your Google login. It
# has its own PENDING_CAPS slots there.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: night-shift-ops-requests
  namespace: ops-broker
rules:
  - apiGroups: [ops.nefcloud.top]
    resources: [opsrequests]
    verbs: [create, get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: night-shift-ops-requests
  namespace: ops-broker
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: night-shift-ops-requests
subjects:
  - kind: ServiceAccount
    name: runner
    namespace: night-shift
  - kind: ServiceAccount
    name: worker
    namespace: night-shift
---
# The night worker's agent: it works like the interactive agent (claude-remote/),
# so it reads the cluster as claude-remote does, to check what it merged
# deployed and is healthy, and files OpsRequests (human-review flags, break-glass)
# through the ops-broker Role above. Read-only: no secrets, exec or writes. What
# it may merge is held by the ops broker's human-review check, not by this.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: worker
  namespace: night-shift
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: night-shift-worker-view
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: view
subjects:
  - kind: ServiceAccount
    name: worker
    namespace: night-shift
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: night-shift-worker-read
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: claude-remote-read  # nodes, CRDs, RBAC, metrics: what view leaves out (claude-remote/rbac.yaml)
subjects:
  - kind: ServiceAccount
    name: worker
    namespace: night-shift
---
# The account Flux impersonates to apply agent-harness's deploy/
# (spec.serviceAccountName of nefcloud/apps/night-shift.yaml): ConfigMaps,
# Secrets, the CronJob and PVCs (the worker's sessions; the quota caps them).
# No RBAC, NetworkPolicy, quota or Jobs, so a change to the app repo can't
# widen what the runner or a task may do.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: night-shift-deployer
  namespace: flux-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: night-shift-deployer
  namespace: night-shift
rules:
  - apiGroups: [""]
    resources: [configmaps, secrets]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [batch]
    resources: [cronjobs]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [""]
    resources: [persistentvolumeclaims]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [""]
    resources: [pods, events]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: night-shift-deployer
  namespace: night-shift
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: night-shift-deployer
subjects:
  - kind: ServiceAccount
    name: night-shift-deployer
    namespace: flux-system
