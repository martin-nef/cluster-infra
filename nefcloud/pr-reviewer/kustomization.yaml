# The sandbox of the PR review agent (martin-nef/pr-reviewer). It lives here,
# not in the app repo, because the reviewer reviews (and the agent can open
# PRs to) that repo: whatever limits it must not be changeable from there. The
# app repo's deploy/ is applied as pr-reviewer-deployer (see rbac.yaml), which
# can only manage the workload inside the namespace.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - rbac.yaml
  - networkpolicy.yaml
  - quota.yaml
  - service.yaml
