# local-path, as night-shift/pvc.yaml: no Longhorn replicas of data that is
# only nice to have. It pins the volume to the node the pod first lands on, so
# the Deployment prefers anything but shitbox and its game servers (as
# claude-remote does). Claude Code's counters are a few hundred series, so 5Gi
# holds the 90 days of retention below many times over.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: victoria-metrics
  namespace: observability
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: victoria-metrics
  namespace: observability
spec:
  replicas: 1
  # One writer per data directory.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: victoria-metrics
  template:
    metadata:
      labels:
        app.kubernetes.io/name: victoria-metrics
    spec:
      automountServiceAccountToken: false
      # The image runs as root by default; it only needs its data directory,
      # which local-path creates world-writable.
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values: [shitbox]
      containers:
        - name: victoria-metrics
          # Multi-arch index digest of v1.155.0.
          image: victoriametrics/victoria-metrics:v1.155.0@sha256:f60dc268b54ecf87f6e09d740c2b732838aa9193090cc741417c9f6386a130df
          args:
            - -storageDataPath=/storage
            - -retentionPeriod=90d
            # OTLP names as Prometheus ones (claude_code_token_usage_tokens_total),
            # which is what Grafana dashboards and PromQL examples use.
            - -opentelemetry.usePrometheusNaming
            # Its own metrics (disk, ingestion, dropped rows), for the alerts later.
            - -selfScrapeInterval=30s
          ports:
            - name: http
              containerPort: 8428
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
              ephemeral-storage: 64Mi
            limits:
              cpu: 500m
              # VictoriaMetrics sizes its caches from this (60% by default).
              memory: 512Mi
              ephemeral-storage: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: storage
              mountPath: /storage
      volumes:
        - name: storage
          persistentVolumeClaim:
            claimName: victoria-metrics
---
apiVersion: v1
kind: Service
metadata:
  name: victoria-metrics
  namespace: observability
spec:
  selector:
    app.kubernetes.io/name: victoria-metrics
  ports:
    - name: http
      port: 8428
      targetPort: http
