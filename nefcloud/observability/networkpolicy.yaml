# Default deny, then one policy per exception, as in claude-remote/. Nothing
# here needs the internet. VictoriaMetrics' HTTP API has no auth (anyone who
# reaches it can write or delete series), so only the collector and vmauth may
# reach it; Grafana gets the same allow when it lands. Any pod in the cluster
# may push to the collector and query through vmauth (read-only); a namespace
# with default-deny egress still needs its own egress allow, as the agents'
# namespaces have (README.md).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: observability
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns
  namespace: observability
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-collector-to-victoria-metrics
  namespace: observability
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: otel-collector
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: victoria-metrics
      ports:
        - {protocol: TCP, port: 8428}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-victoria-metrics-from-collector
  namespace: observability
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: victoria-metrics
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: otel-collector
      ports:
        - {protocol: TCP, port: 8428}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-collector-from-cluster
  namespace: observability
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: otel-collector
  policyTypes: [Ingress]
  ingress:
    # Pods in any namespace; not host-network traffic or anything outside.
    - from:
        - namespaceSelector: {}
      ports:
        - {protocol: TCP, port: 4318}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-vmauth-to-victoria-metrics
  namespace: observability
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: vmauth
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: victoria-metrics
      ports:
        - {protocol: TCP, port: 8428}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-victoria-metrics-from-vmauth
  namespace: observability
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: victoria-metrics
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: vmauth
      ports:
        - {protocol: TCP, port: 8428}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-vmauth-from-cluster
  namespace: observability
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: vmauth
  policyTypes: [Ingress]
  ingress:
    # As the collector: pods in any namespace. Only the proxy port; vmauth's
    # internal port (8426) stays closed.
    - from:
        - namespaceSelector: {}
      ports:
        - {protocol: TCP, port: 8427}
