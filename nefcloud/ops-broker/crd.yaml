# An OpsRequest asks the ops broker to run one break-glass action. The schema
# is the verb list: the API server refuses anything else before the broker
# sees it. spec is immutable, so what you approve is what runs; status is a
# subresource that only the broker can write. Cluster verbs take spec.target,
# GitHub verbs spec.github. spec.requester is set by admission.yaml, never by
# the requester.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: opsrequests.ops.nefcloud.top
spec:
  group: ops.nefcloud.top
  scope: Namespaced
  names:
    kind: OpsRequest
    listKind: OpsRequestList
    plural: opsrequests
    singular: opsrequest
    shortNames: [opsreq]
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - {name: Verb, type: string, jsonPath: .spec.verb}
        - {name: Kind, type: string, jsonPath: .spec.target.kind}
        - {name: Namespace, type: string, jsonPath: .spec.target.namespace}
        - {name: Target, type: string, jsonPath: .spec.target.name}
        - {name: Repo, type: string, jsonPath: .spec.github.repo}
        - {name: Requester, type: string, jsonPath: .spec.requester, priority: 1}
        - {name: Workstream, type: string, jsonPath: .spec.workstream, priority: 1}
        - {name: Session, type: string, jsonPath: .spec.session, priority: 1}
        - {name: Phase, type: string, jsonPath: .status.phase}
        - {name: Expires, type: date, jsonPath: .status.expiresAt, priority: 1}
        - {name: Age, type: date, jsonPath: .metadata.creationTimestamp}
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              required: [verb, reason]
              x-kubernetes-validations:
                - rule: self == oldSelf
                  message: spec is immutable; create a new OpsRequest
                - rule: >-
                    self.verb == 'question' ? (has(self.question) && !has(self.target) && !has(self.github)) :
                    !has(self.question) && (self.verb.startsWith('github-') ? (has(self.github) && !has(self.target)) :
                    (has(self.target) && !has(self.github)))
                  message: question takes spec.question, GitHub verbs spec.github, the others spec.target
                - rule: >-
                    !has(self.github) || self.verb != 'github-commit-workflows' || (has(self.github.branch) && has(self.github.baseSHA) &&
                    has(self.github.message) && has(self.github.files))
                  message: github-commit-workflows needs github.branch, baseSHA, message and files
                - rule: "!has(self.github) || self.verb != 'github-rerun-workflow' || has(self.github.runID)"
                  message: github-rerun-workflow needs github.runID
                - rule: "!has(self.github) || self.verb != 'github-dispatch-workflow' || has(self.github.workflow)"
                  message: github-dispatch-workflow needs github.workflow
                - rule: "!has(self.github) || self.verb != 'github-human-review' || (has(self.github.pr) && has(self.github.headSHA))"
                  message: github-human-review needs github.pr and headSHA
                - rule: "!has(self.target) || self.verb != 'delete-pod' || self.target.kind == 'Pod'"
                  message: delete-pod targets a Pod
                - rule: "!has(self.target) || self.verb != 'rollout-restart' || self.target.kind in ['Deployment', 'StatefulSet', 'DaemonSet']"
                  message: rollout-restart targets a Deployment, StatefulSet or DaemonSet
                - rule: >-
                    !has(self.target) || !(self.verb in ['flux-reconcile', 'flux-suspend', 'flux-resume']) ||
                    self.target.kind in ['Kustomization', 'HelmRelease', 'GitRepository', 'HelmRepository']
                  message: flux verbs target a Kustomization, HelmRelease, GitRepository or HelmRepository
                - rule: >-
                    !has(self.target) || (self.verb == 'create-sops-age-key') == (self.target.kind == 'Secret')
                  message: create-sops-age-key, and only it, targets a Secret
                - rule: >-
                    !has(self.target) || self.verb != 'create-sops-age-key' ||
                    (self.target.namespace == 'flux-system' && self.target.name.endsWith('-sops-age'))
                  message: create-sops-age-key makes flux-system/<app>-sops-age only
              properties:
                verb:
                  type: string
                  enum: [delete-pod, rollout-restart, flux-reconcile, flux-suspend, flux-resume, create-sops-age-key,
                         github-commit-workflows, github-protect-branch, github-rerun-workflow, github-dispatch-workflow,
                         github-create-repo, github-human-review, github-require-human-review, question]
                target:
                  type: object
                  required: [kind, namespace, name]
                  properties:
                    kind:
                      type: string
                      enum: [Pod, Deployment, StatefulSet, DaemonSet, Kustomization, HelmRelease, GitRepository, HelmRepository,
                             Secret]
                    namespace:
                      type: string
                      maxLength: 63
                      pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                    name:
                      type: string
                      maxLength: 253
                      pattern: ^[a-z0-9]([-.a-z0-9]*[a-z0-9])?$
                github:
                  description: The repo (under the broker's GITHUB_OWNER) and what to do there.
                  type: object
                  required: [repo]
                  properties:
                    repo:
                      type: string
                      maxLength: 100
                      pattern: ^[A-Za-z0-9_.-]+$
                      x-kubernetes-validations:
                        - rule: self != '.' && self != '..'
                          message: not a repo name
                    branch:
                      description: github-commit-workflows; a work branch, never the default branch.
                      type: string
                      maxLength: 255
                      pattern: ^[A-Za-z0-9._/-]+$
                      x-kubernetes-validations:
                        - rule: "!self.contains('..') && !self.startsWith('/') && !self.endsWith('/') && !self.contains('//')"
                          message: not a branch name
                    baseSHA:
                      description: github-commit-workflows; the branch's head now. The commit goes on top of exactly this.
                      type: string
                      pattern: ^[0-9a-f]{40}$
                    message:
                      description: github-commit-workflows; the commit message.
                      type: string
                      minLength: 1
                      maxLength: 2000
                    files:
                      description: github-commit-workflows; each file's new content, or delete.
                      type: array
                      minItems: 1
                      maxItems: 10
                      x-kubernetes-list-type: map
                      x-kubernetes-list-map-keys: [path]
                      items:
                        type: object
                        required: [path]
                        x-kubernetes-validations:
                          - rule: "has(self.content) != (has(self.delete) && self.delete)"
                            message: "give either content or delete: true"
                        properties:
                          path:
                            type: string
                            maxLength: 200
                            pattern: ^\.github/workflows/[A-Za-z0-9._-]+\.ya?ml$
                          content:
                            type: string
                            maxLength: 65536
                          delete:
                            type: boolean
                    runID:
                      description: github-rerun-workflow; the run whose failed jobs to re-run.
                      type: integer
                      minimum: 1
                    workflow:
                      description: github-dispatch-workflow; the workflow's file name, e.g. image.yml.
                      type: string
                      maxLength: 200
                      pattern: ^[A-Za-z0-9._-]+\.ya?ml$
                    inputs:
                      description: github-dispatch-workflow; its workflow_dispatch inputs.
                      type: object
                      maxProperties: 10
                      additionalProperties:
                        type: string
                        maxLength: 1000
                    pr:
                      description: github-human-review; the PR's number.
                      type: integer
                      minimum: 1
                    headSHA:
                      description: github-human-review; the PR's head now. The sign-off covers exactly this commit.
                      type: string
                      pattern: ^[0-9a-f]{40}$
                    private:
                      description: github-create-repo; default true.
                      type: boolean
                    description:
                      description: github-create-repo; the repo's description.
                      type: string
                      maxLength: 350
                question:
                  description: >-
                    question; what to ask the user before the work starts. Nothing runs: the answer is
                    written to status.answer.
                  type: object
                  required: [text, ifUnanswered]
                  properties:
                    text:
                      description: The question, as plain text.
                      type: string
                      minLength: 1
                      maxLength: 2000
                    options:
                      description: Optional answers to pick from (2-4), each with what the agent then does.
                      type: array
                      minItems: 2
                      maxItems: 4
                      x-kubernetes-list-type: map
                      x-kubernetes-list-map-keys: [label]
                      items:
                        type: object
                        required: [label, then]
                        properties:
                          label:
                            description: The answer, short, e.g. "A" or "Keep the old API".
                            type: string
                            minLength: 1
                            maxLength: 100
                            pattern: ^[^\r\n]+$
                          then:
                            description: What the agent does with this answer.
                            type: string
                            minLength: 1
                            maxLength: 500
                    ifUnanswered:
                      description: What the agent does if nobody answers before it expires.
                      type: string
                      minLength: 1
                      maxLength: 500
                reason:
                  description: Why, in a sentence or two. Shown to the approver as the requester's claim.
                  type: string
                  minLength: 1
                  maxLength: 1000
                requester:
                  description: >-
                    Who created it (the API server's username). Stamped by the opsrequests-requester
                    admission policy, whatever the request said; don't set it.
                  type: string
                  maxLength: 253
                session:
                  description: >-
                    The requester's session: the Claude session id for claude-remote (CLAUDE_CODE_SESSION_ID),
                    the workstream's session for the night shift. A session's requests are one group on the ops
                    page and in the notification. Optional; without it, requests group by workstream.
                  type: string
                  minLength: 1
                  maxLength: 100
                  pattern: ^[A-Za-z0-9_.:-]+$
                workstream:
                  description: >-
                    The theme: a short name for what the session is doing, the same for every request of it
                    (the latest one names the group). Without a session, it groups the requester's requests.
                    Optional.
                  type: string
                  minLength: 1
                  maxLength: 80
                  pattern: ^[^\r\n]+$
                ttlSeconds:
                  description: >-
                    How long it may wait for a decision. Default the broker's REQUEST_TTL (24 h);
                    capped at its MAX_TTL (24 h). Shorter only for a request that is worth nothing
                    later. Ignored for github-human-review: a flag lasts until its PR is
                    closed or gets new commits.
                  type: integer
                  minimum: 60
                  maximum: 86400
            status:
              type: object
              properties:
                phase:
                  type: string
                  enum: [Pending, Approved, Succeeded, Failed, Unknown, Denied, Expired, Rejected, Superseded, Withdrawn,
                         Answered]
                message: {type: string}
                specHash: {type: string}
                expiresAt: {type: string, format: date-time}
                notifiedAt:
                  description: >-
                    When a notification announced it; unset while it waits to be announced (debounced, or held
                    through the quiet hours).
                  type: string
                  format: date-time
                targetUID: {type: string}
                decidedBy: {type: string}
                decidedAt: {type: string, format: date-time}
                finishedAt: {type: string, format: date-time}
                answer:
                  description: question; the user's answer (phase Answered).
                  type: object
                  properties:
                    option:
                      description: The label of the option picked, if one was.
                      type: string
                    text:
                      description: What the user wrote, if anything.
                      type: string
                    by:
                      description: Who answered (their login email).
                      type: string
                    at: {type: string, format: date-time}
---
# An OpsWithdrawal says a requester no longer needs its own waiting requests:
# one by name, or every one of a session (but its flags, which their PRs end).
# The broker ends them Withdrawn, which frees their slots. A separate object,
# so OpsRequest.spec stays immutable and the requesters' RBAC stays create
# and read. spec.requester is stamped by admission.yaml, and the broker acts
# only on requests with the same requester.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: opswithdrawals.ops.nefcloud.top
spec:
  group: ops.nefcloud.top
  scope: Namespaced
  names:
    kind: OpsWithdrawal
    listKind: OpsWithdrawalList
    plural: opswithdrawals
    singular: opswithdrawal
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - {name: Request, type: string, jsonPath: .spec.request}
        - {name: Session, type: string, jsonPath: .spec.session}
        - {name: Phase, type: string, jsonPath: .status.phase}
        - {name: Message, type: string, jsonPath: .status.message}
        - {name: Age, type: date, jsonPath: .metadata.creationTimestamp}
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              x-kubernetes-validations:
                - rule: self == oldSelf
                  message: spec is immutable; create a new OpsWithdrawal
                - rule: has(self.request) != has(self.session)
                  message: give either request or session
              properties:
                request:
                  description: The name of one of your OpsRequests that still waits.
                  type: string
                  maxLength: 253
                  pattern: ^[a-z0-9]([-.a-z0-9]*[a-z0-9])?$
                session:
                  description: >-
                    Every OpsRequest of yours with this spec.session that still waits, but flags
                    (github-human-review): their PRs end them.
                  type: string
                  minLength: 1
                  maxLength: 100
                  pattern: ^[A-Za-z0-9_.:-]+$
                reason:
                  description: Why it's no longer needed; shown on the requests.
                  type: string
                  maxLength: 500
                requester:
                  description: Who created it. Stamped by the opsrequests-requester admission policy; don't set it.
                  type: string
                  maxLength: 253
            status:
              type: object
              properties:
                phase:
                  type: string
                  enum: [Done, Refused]
                message: {type: string}
                withdrawn:
                  description: The requests it ended.
                  type: array
                  items: {type: string}
                finishedAt: {type: string, format: date-time}
