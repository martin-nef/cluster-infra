# The ops broker's limits: its namespace, ServiceAccount, RBAC (the cluster
# verbs), the admission policy pinning its SOPS keys, and its ntfy Secret.
# The broker itself is its own Flux app, martin-nef/ops-broker
# (nefcloud/apps/ops-broker.yaml). See README.md.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - crd.yaml
  - admission.yaml
  - rbac.yaml
  - secrets.yaml
