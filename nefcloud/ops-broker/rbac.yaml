apiVersion: v1
kind: ServiceAccount
metadata:
  name: ops-broker
  namespace: ops-broker
---
# The verbs, and nothing else: no create, no update, no Secrets, no exec.
# patch is still a broad permission on these kinds; the broker's code only
# ever sends its fixed patches (martin-nef/ops-broker internal/verbs).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ops-broker-actions
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, delete]
  - apiGroups: [apps]
    resources: [deployments, statefulsets, daemonsets]
    verbs: [get, patch]
  - apiGroups: [kustomize.toolkit.fluxcd.io]
    resources: [kustomizations]
    verbs: [get, patch]
  - apiGroups: [helm.toolkit.fluxcd.io]
    resources: [helmreleases]
    verbs: [get, patch]
  - apiGroups: [source.toolkit.fluxcd.io]
    resources: [gitrepositories, helmrepositories]
    verbs: [get, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ops-broker-actions
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: ops-broker-actions
subjects:
  - kind: ServiceAccount
    name: ops-broker
    namespace: ops-broker
---
# create-sops-age-key: a new Flux app's SOPS key, made in the broker so its
# private half never leaves the cluster. Create only: no get or list, so the
# broker can't read the other apps' keys, and an existing one can't be
# replaced (the create fails). admission.yaml limits it to *-sops-age names
# holding a single age.agekey.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ops-broker-sops-keys
  namespace: flux-system
rules:
  - apiGroups: [""]
    resources: [secrets]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ops-broker-sops-keys
  namespace: flux-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ops-broker-sops-keys
subjects:
  - kind: ServiceAccount
    name: ops-broker
    namespace: ops-broker
