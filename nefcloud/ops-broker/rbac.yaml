apiVersion: v1
kind: ServiceAccount
metadata:
  name: ops-broker
  namespace: ops-broker
---
# The verbs, and nothing else: no create, no update, no Secrets, no exec.
# patch is still a broad permission on these kinds; the broker's code only
# ever sends the fixed patches in broker.py (see README.md, trade-offs).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ops-broker-actions
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, delete]
  - apiGroups: [apps]
    resources: [deployments, statefulsets, daemonsets]
    verbs: [get, patch]
  - apiGroups: [kustomize.toolkit.fluxcd.io]
    resources: [kustomizations]
    verbs: [get, patch]
  - apiGroups: [helm.toolkit.fluxcd.io]
    resources: [helmreleases]
    verbs: [get, patch]
  - apiGroups: [source.toolkit.fluxcd.io]
    resources: [gitrepositories, helmrepositories]
    verbs: [get, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ops-broker-actions
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: ops-broker-actions
subjects:
  - kind: ServiceAccount
    name: ops-broker
    namespace: ops-broker
---
# Its own queue: read requests, write their status, delete old ones.
# The pod's two containers (broker and minter) share this ServiceAccount.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ops-broker
  namespace: ops-broker
rules:
  - apiGroups: [ops.nefcloud.top]
    resources: [opsrequests]
    verbs: [get, list, watch, delete]
  # Files a github-human-review request for the PR reviewer's needs_human
  # flag (its Jobs have no API access), and a github-require-human-review one
  # for a repo without the ruleset. Admission stamps this ServiceAccount as the
  # requester, so they're requests like any other: you still decide them.
  - apiGroups: [ops.nefcloud.top]
    resources: [opsrequests]
    verbs: [create]
  - apiGroups: [ops.nefcloud.top]
    resources: [opsrequests/status]
    verbs: [get, patch]
  # The GitHub App's key and OAuth client: the minter sidecar stores them from the setup page
  # (create can't be limited to a name, so any Secret in this namespace). No
  # get: only the minter reads it, through its Secret volume, which the kubelet
  # fills in. Not the ntfy Secret, which Flux gives the pod as an env var.
  - apiGroups: [""]
    resources: [secrets]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ops-broker
  namespace: ops-broker
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ops-broker
subjects:
  - kind: ServiceAccount
    name: ops-broker
    namespace: ops-broker
---
# create-sops-age-key: a new Flux app's SOPS key, made in the broker so its
# private half never leaves the cluster. Create only: no get or list, so the
# broker can't read the other apps' keys, and an existing one can't be
# replaced (the create fails). admission.yaml limits it to *-sops-age names
# holding a single age.agekey.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ops-broker-sops-keys
  namespace: flux-system
rules:
  - apiGroups: [""]
    resources: [secrets]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ops-broker-sops-keys
  namespace: flux-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ops-broker-sops-keys
subjects:
  - kind: ServiceAccount
    name: ops-broker
    namespace: ops-broker
