# The approval page, behind the same Google login as Headlamp. The broker also
# checks the email against ALLOWED_APPROVERS (config.env).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ops-broker
  namespace: ops-broker
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: >-
      oauth2-proxy-google@kubernetescrd
spec:
  rules:
    - host: ops.nefcloud.top
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ops-broker
                port:
                  number: 80
