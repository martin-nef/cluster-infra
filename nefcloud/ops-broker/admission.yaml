# RBAC's create lets a requester set any metadata, and two fields would undo
# the audit trail: an ownerReference (even to an object that doesn't exist)
# hands the request to the garbage collector, which deletes it; a finalizer
# stops the broker's retention cleanup and holds quota forever. The CRD's own
# rules can't see metadata, so this refuses both on create, for every requester.
# Only CREATE: nothing but admins may update requests, and the API server's own
# foreground-deletion finalizer must keep working. It also checks the requester
# stamp below took.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: opsrequests-plain-metadata
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [ops.nefcloud.top]
        apiVersions: ["*"]
        operations: [CREATE]
        resources: [opsrequests]
  validations:
    - expression: "!has(object.metadata.ownerReferences) || size(object.metadata.ownerReferences) == 0"
      message: OpsRequests may not have ownerReferences (they would let the garbage collector delete the audit record)
    - expression: "!has(object.metadata.finalizers) || size(object.metadata.finalizers) == 0"
      message: OpsRequests may not have finalizers (they would block retention cleanup)
    # Set by the mutating policy below, which runs first. If that policy is
    # missing or broken, requests are refused rather than taken at their word.
    - expression: "has(object.spec.requester) && object.spec.requester == request.userInfo.username"
      message: spec.requester must be the creator; the opsrequests-requester policy sets it, so it isn't running
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: opsrequests-plain-metadata
spec:
  policyName: opsrequests-plain-metadata
  validationActions: [Deny]
---
# Who asked, as the API server authenticated them, so the approval page and the
# per-requester pending caps (config.env PENDING_CAPS) don't rest on the
# requester's word. Overwrites whatever spec.requester the request carried.
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingAdmissionPolicy
metadata:
  name: opsrequests-requester
spec:
  failurePolicy: Fail
  reinvocationPolicy: Never
  matchConstraints:
    resourceRules:
      - apiGroups: [ops.nefcloud.top]
        apiVersions: ["*"]
        operations: [CREATE]
        resources: [opsrequests]
  mutations:
    - patchType: ApplyConfiguration
      applyConfiguration:
        expression: >-
          Object{spec: Object.spec{requester: request.userInfo.username}}
---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingAdmissionPolicyBinding
metadata:
  name: opsrequests-requester
spec:
  policyName: opsrequests-requester
---
# RBAC can't limit create to a name, so this does: in flux-system, the broker
# may only create <app>-sops-age Secrets holding one key, age.agekey
# (create-sops-age-key). Anyone else's Secrets there aren't matched.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: ops-broker-sops-keys-only
spec:
  failurePolicy: Fail
  matchConstraints:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: flux-system
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [secrets]
  matchConditions:
    - name: from-the-broker
      expression: request.userInfo.username == 'system:serviceaccount:ops-broker:ops-broker'
  validations:
    - expression: object.metadata.name.endsWith('-sops-age') && object.metadata.name.matches('^[a-z0-9]([-a-z0-9]{0,40}[a-z0-9])?-sops-age$')
      message: the ops broker may only create flux-system/<app>-sops-age
    - expression: has(object.data) && object.data.size() == 1 && 'age.agekey' in object.data && !has(object.stringData)
      message: an <app>-sops-age Secret holds one key, age.agekey
    - expression: request.operation == 'CREATE'
      message: the ops broker never changes an existing SOPS key
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: ops-broker-sops-keys-only
spec:
  policyName: ops-broker-sops-keys-only
  validationActions: [Deny]
