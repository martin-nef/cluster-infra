# Default deny for every pod in the namespace, then one policy per exception.
# Policies only ever add allows, which is why the app repo's deployer can't
# create them.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: claude-remote
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns
  namespace: claude-remote
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
---
# The apiserver, for read-only kubectl. NetworkPolicy sees the Service's
# endpoints (the k3s servers' tailnet IPs, port 6443), not its ClusterIP, so
# allow 6443 on the whole tailnet range: no node IPs to keep in sync, and only
# k3s servers listen on 6443 there. The rest of the tailnet stays denied.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-apiserver
  namespace: claude-remote
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - ipBlock: {cidr: 100.64.0.0/10}
      ports:
        - {protocol: TCP, port: 6443}
---
# The internet over HTTP(S): public addresses only. Between them, the three
# RFC 1918 blocks cover the home LAN, whichever range its router uses.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-internet-web
  namespace: claude-remote
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - 10.0.0.0/8      # RFC 1918: k3s pods (10.42.0.0/16) and Services (10.43.0.0/16), and any 10.x LAN or OCI VCN
              - 172.16.0.0/12   # RFC 1918: other private networks, e.g. Docker bridges on the nodes (172.17.0.0/16)
              - 192.168.0.0/16  # RFC 1918: home LAN (router, NAS, other devices next to shitbox)
              - 100.64.0.0/10   # CGNAT range Tailscale uses: every node's tailnet IP and all your other devices
              - 169.254.0.0/16  # link-local: cloud instance metadata (OCI's 169.254.169.254 serves instance credentials)
      ports:
        - {protocol: TCP, port: 443}
        - {protocol: TCP, port: 80}
