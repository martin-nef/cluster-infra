# The scratchpad: a namespace where agents try a deploy before they open a PR.
# They may create, change and delete workloads here and nowhere else. What
# keeps it safe lives here, out of their reach: pod security (namespace.yaml),
# a quota and a low priority (quota.yaml), network isolation
# (networkpolicy.yaml), Service limits RBAC can't express (admission.yaml),
# and a nightly sweep of old objects (sweep.yaml). See README.md. No Ingress yet: that needs a host and login check first.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - quota.yaml
  - networkpolicy.yaml
  - rbac.yaml
  - admission.yaml
  - sweep.yaml
configMapGenerator:
  # Hashed: an edit to the script changes the CronJob's next pod.
  - name: scratchpad-sweep
    namespace: scratchpad-sweep
    files:
      - sweep/sweep.py
