# What RBAC can't limit: the Role lets agents create Services, and two kinds of
# Service reach outside the namespace. externalIPs make kube-proxy on every node
# capture traffic to those addresses from every pod in the cluster
# (CVE-2020-8554), so an agent could take over traffic to any IP. An
# ExternalName Service points at any name, such as another namespace's
# Service. The quota already holds LoadBalancer and NodePort at 0. This keeps
# scratchpad Services to plain ClusterIP, for every requester.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: scratchpad-services
spec:
  failurePolicy: Fail
  matchConstraints:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: scratchpad
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [services]
  validations:
    - expression: "!has(object.spec.type) || object.spec.type == 'ClusterIP'"
      message: scratchpad Services must be ClusterIP (reach them with kubectl port-forward)
    - expression: "!has(object.spec.externalIPs) || size(object.spec.externalIPs) == 0"
      message: scratchpad Services may not set externalIPs (they capture cluster-wide traffic to those addresses)
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: scratchpad-services
spec:
  policyName: scratchpad-services
  validationActions: [Deny]
