apiVersion: ://oauth2proxy.com
kind: Proxy
metadata:
  name: central-oauth2-proxy
  namespace: auth
spec:
  replicas: 2
  config:
    provider: "google" # or keycloak, github, oidc etc.
    clientID: "your-client-id"
    clientSecret: "your-client-secret"
    cookieSecret: "your-random-base64-cookie-secret"

    # Allows cookies and redirects to work seamlessly across *.nefcloud.top
    cookieDomain: ".nefcloud.top"
    whitelistDomain: ".nefcloud.top"

    # Defer matching logic entirely to your mounted explicit email file
    emailDomain: "*"
  deployment:
    extraVolumes:
      - name: email-list-volume
        configMap:
          name: admin-emails
    extraVolumeMounts:
      - name: email-list-volume
        mountPath: /etc/oauth2-proxy
        readOnly: true
    extraEnv:
      - name: OAUTH2_PROXY_AUTHENTICATED_EMAILS_FILE
        value: "/etc/oauth2-proxy/allowed_emails.txt"
