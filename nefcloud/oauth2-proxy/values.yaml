config:
  existingSecret: google-oauth2-creds
  provider: google
  cookieDomain: .nefcloud.top
  # No domain is trusted wholesale: only the addresses in the admin-emails
  # ConfigMap may sign in. The chart default is ["*"] (any Google account).
  emailDomains: []
authenticatedEmailsFile:
  enabled: true
  persistence: configmap
  template: admin-emails
  restrictedUserAccessKey: allowed_emails.txt
extraArgs:
  cookie-secure: "true"
  cookie-refresh: "1h"
  cookie-expire: "168h"
  cookie-samesite: "lax"
  cookie-csrf-per-request: "true"
  skip-provider-button: "true"
  upstream: static://200
  reverse-proxy: "true"
  proxy-prefix: "/oauth2"
  set-xauthrequest: "true"
  whitelist-domain: .nefcloud.top
