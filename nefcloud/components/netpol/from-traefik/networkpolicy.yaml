# Ingress from Traefik only (HTTP through cloudflared or the tailnet, and the
# game server entrypoints). Every pod on 8080 by default; patch podSelector to
# the pods behind the Ingress/IngressRoute, and ports if they listen elsewhere.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-from-traefik
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - port: 8080
