---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: headlamp-auth
  namespace: kube-system
---
# The proxy authenticates as this account and impersonates the oauth2-proxy
# email. Keep resourceNames in sync with oauth2-proxy's allowed_emails.txt.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: headlamp-impersonate
rules:
  - apiGroups: [""]
    resources: ["users"]
    verbs: ["impersonate"]
    resourceNames:
      - martin.nefjodov@gmail.com
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: headlamp-impersonate
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: headlamp-impersonate
subjects:
  - kind: ServiceAccount
    name: headlamp-auth
    namespace: kube-system
---
# Read-only access to cluster-scoped and policy resources that the built-in
# view/edit/admin roles leave out, so Headlamp can show them.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: headlamp-cluster-read
rules:
  - apiGroups: [""]
    resources: ["nodes", "persistentvolumes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["metrics.k8s.io"]
    resources: ["*"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses", "volumeattributesclasses", "csidrivers", "csinodes", "volumeattachments"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingressclasses"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["gateway.networking.k8s.io", "gateway.networking.x-k8s.io"]
    resources: ["*"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["scheduling.k8s.io"]
    resources: ["priorityclasses"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["node.k8s.io"]
    resources: ["runtimeclasses"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["roles", "rolebindings", "clusterroles", "clusterrolebindings"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["*"]
    verbs: ["get", "list", "watch"]
  # Custom resources. Groups are listed explicitly (not "*", which would also match
  # the core group); add a group here when a new CRD family is installed.
  - apiGroups:
      - traefik.io
      - hub.traefik.io
      - tailscale.com
      - source.toolkit.fluxcd.io
      - notification.toolkit.fluxcd.io
      - kustomize.toolkit.fluxcd.io
      - helm.toolkit.fluxcd.io
      - helm.cattle.io
      - k3s.cattle.io
    resources: ["*"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: headlamp-user-martin-cluster-read
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: headlamp-cluster-read
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: User
    name: martin.nefjodov@gmail.com
---
# What the impersonated user may do. Bump to cluster-admin to manage from Headlamp.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: headlamp-user-martin
  annotations:
    # roleRef is immutable; let Flux delete and recreate the binding when the role changes.
    kustomize.toolkit.fluxcd.io/force: enabled
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: edit
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: User
    name: martin.nefjodov@gmail.com
---
# Long-lived token, populated by the token controller; never lives in git.
apiVersion: v1
kind: Secret
metadata:
  name: headlamp-auth-token
  namespace: kube-system
  annotations:
    kubernetes.io/service-account.name: headlamp-auth
type: kubernetes.io/service-account-token
