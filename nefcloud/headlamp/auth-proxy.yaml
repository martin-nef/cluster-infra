# nginx in front of Headlamp: trusts the email set by oauth2-proxy (via Traefik
# forwardAuth) and calls Headlamp as the headlamp-auth ServiceAccount
# impersonating that user. The token comes from a Secret, not from git.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: headlamp-auth
  namespace: kube-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: headlamp-auth
  template:
    metadata:
      labels:
        app: headlamp-auth
    spec:
      containers:
        - name: nginx
          image: nginxinc/nginx-unprivileged:1.27-alpine
          ports:
            - containerPort: 8080
          env:
            - name: NGINX_ENVSUBST_FILTER
              value: ^TOKEN$
            - name: TOKEN
              valueFrom:
                secretKeyRef:
                  name: headlamp-auth-token
                  key: token
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 200m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: template
              mountPath: /etc/nginx/templates
              readOnly: true
      volumes:
        - name: template
          configMap:
            name: headlamp-auth-nginx
---
apiVersion: v1
kind: Service
metadata:
  name: headlamp-auth
  namespace: kube-system
spec:
  selector:
    app: headlamp-auth
  ports:
    - port: 80
      targetPort: 8080
---
# X-Auth-Request-Email is only trustworthy when the request came through
# Traefik, so refuse everything else.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: headlamp-auth-from-traefik
  namespace: kube-system
spec:
  podSelector:
    matchLabels:
      app: headlamp-auth
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - port: 8080
---
# The Headlamp backend carries no auth of its own; it trusts the Authorization
# token the headlamp-auth proxy injects. Only that proxy should reach it, or any
# pod on the flat cluster network could call the backend directly and bypass
# oauth2-proxy. Restrict ingress to the nginx auth proxy on the backend port.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: headlamp-backend-from-auth-proxy
  namespace: kube-system
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: headlamp
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: headlamp-auth
      ports:
        - port: 4466
