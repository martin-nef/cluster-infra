# nginx in front of Headlamp: trusts the email set by oauth2-proxy (via Traefik
# forwardAuth) and calls Headlamp as the headlamp-auth ServiceAccount
# impersonating that user. The token comes from a Secret, not from git.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: headlamp-auth-nginx
  namespace: kube-system
data:
  default.conf.template: |
    map $http_upgrade $connection_upgrade {
      default upgrade;
      ""      close;
    }
    server {
      listen 8080;
      location / {
        if ($http_x_auth_request_email = "") { return 401; }
        proxy_pass http://my-headlamp.kube-system.svc.cluster.local:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Authorization "Bearer ${TOKEN}";
        proxy_set_header Impersonate-User $http_x_auth_request_email;
        proxy_set_header Impersonate-Group "";
        proxy_set_header Impersonate-Uid "";
        proxy_read_timeout 1h;
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: headlamp-auth
  namespace: kube-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: headlamp-auth
  template:
    metadata:
      labels:
        app: headlamp-auth
    spec:
      containers:
        - name: nginx
          image: nginxinc/nginx-unprivileged:1.27-alpine
          ports:
            - containerPort: 8080
          env:
            - name: NGINX_ENVSUBST_FILTER
              value: ^TOKEN$
            - name: TOKEN
              valueFrom:
                secretKeyRef:
                  name: headlamp-auth-token
                  key: token
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 200m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: template
              mountPath: /etc/nginx/templates
              readOnly: true
      volumes:
        - name: template
          configMap:
            name: headlamp-auth-nginx
---
apiVersion: v1
kind: Service
metadata:
  name: headlamp-auth
  namespace: kube-system
spec:
  selector:
    app: headlamp-auth
  ports:
    - port: 80
      targetPort: 8080
---
# X-Auth-Request-Email is only trustworthy when the request came through
# Traefik, so refuse everything else.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: headlamp-auth-from-traefik
  namespace: kube-system
spec:
  podSelector:
    matchLabels:
      app: headlamp-auth
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - port: 8080
