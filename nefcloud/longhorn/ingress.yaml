---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: longhorn-ingress
  namespace: longhorn-system
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: >-
      longhorn-system-basic-auth@kubernetescrd,
      longhorn-system-upload-limit@kubernetescrd
spec:
  rules:
    - host: longhornbasic.nefcloud.top
      http:
        paths:
          - pathType: Prefix
            path: "/"
            backend:
              service:
                name: longhorn-frontend
                port:
                  number: 80
---
# No auth middleware — oauth2 callback/start must be reachable BEFORE the session cookie is set
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: longhorn-oauth2-ingress
  namespace: longhorn-system
spec:
  rules:
    - host: longhorn.nefcloud.top
      http:
        paths:
          - path: /oauth2
            pathType: Prefix
            backend:
              service:
                name: oauth2-proxy-bridge
                port:
                  number: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: longhorn-ui-ingress
  namespace: longhorn-system
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: >-
      oauth2-proxy-google@kubernetescrd,
      longhorn-system-upload-limit@kubernetescrd
spec:
  rules:
    - host: longhorn.nefcloud.top
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: longhorn-frontend
                port:
                  number: 80
---
apiVersion: v1
kind: Service
metadata:
  name: oauth2-proxy-bridge
  namespace: longhorn-system
spec:
  type: ExternalName
  externalName: oauth2-proxy-release.oauth2-proxy.svc.cluster.local
  ports:
    - name: http
      port: 80
      targetPort: 80
      protocol: TCP
