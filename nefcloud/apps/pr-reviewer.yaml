---
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: pr-reviewer
  namespace: flux-system
spec:
  interval: 1m0s
  ref:
    branch: main
  secretRef:
    name: pr-reviewer-auth
  url: ssh://git@github.com/martin-nef/pr-reviewer.git
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: pr-reviewer
  namespace: flux-system
spec:
  interval: 10m0s
  path: ./deploy
  prune: true
  sourceRef:
    kind: GitRepository
    name: pr-reviewer
  decryption:
    provider: sops
    secretRef:
      name: pr-reviewer-sops-age
  # The reviewer's repo is one the agents open PRs to, so Flux applies it as an
  # account that can only manage its workload in its namespace; the sandbox
  # (RBAC, NetworkPolicy, quota, Service, Ingress) is nefcloud/pr-reviewer/.
  # Written by hand, not by flux.sh, for these two fields; flux.sh still makes
  # the deploy key and pr-reviewer-auth.
  serviceAccountName: pr-reviewer-deployer
  targetNamespace: pr-reviewer
