---
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: ops-broker
  namespace: flux-system
spec:
  interval: 1m0s
  ref:
    branch: main
  secretRef:
    name: ops-broker-auth
  url: ssh://git@github.com/martin-nef/ops-broker.git
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: ops-broker
  namespace: flux-system
spec:
  interval: 10m0s
  path: ./deploy
  prune: true
  sourceRef:
    kind: GitRepository
    name: ops-broker
  # The agents' API key hashes (deploy/api-keys.secrets.yaml there). The key
  # was made in the cluster by the ops broker (create-sops-age-key-rj5xp).
  decryption:
    provider: sops
    secretRef:
      name: ops-broker-sops-age
