apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: night-shift
  namespace: flux-system
spec:
  interval: 1m0s
  ref:
    branch: main
  secretRef:
    name: night-shift-auth
  url: ssh://git@github.com/martin-nef/agent-harness.git
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: night-shift
  namespace: flux-system
spec:
  interval: 10m0s
  path: ./deploy
  prune: true
  sourceRef:
    kind: GitRepository
    name: night-shift
  # agent-harness is a repo the agents open PRs to (the night worker among
  # them), so Flux applies it as an account that can only manage its workload
  # in its namespace; the sandbox (RBAC, NetworkPolicy, quota, PVC) is
  # nefcloud/night-shift/. Written by hand, not by flux.sh, for these two
  # fields; flux.sh still makes the deploy key and night-shift-auth.
  decryption:
    provider: sops
    secretRef:
      name: night-shift-sops-age
  serviceAccountName: night-shift-deployer
  targetNamespace: night-shift
