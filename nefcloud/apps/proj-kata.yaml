---
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: proj-kata
  namespace: flux-system
spec:
  interval: 1m0s
  ref:
    branch: main
  secretRef:
    name: proj-kata-auth
  url: ssh://git@github.com/martin-nef/proj-kata.git
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: proj-kata
  namespace: flux-system
spec:
  interval: 10m0s
  path: ./deploy
  prune: true
  sourceRef:
    kind: GitRepository
    name: proj-kata
