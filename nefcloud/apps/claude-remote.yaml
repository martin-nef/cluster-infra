---
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: claude-remote
  namespace: flux-system
spec:
  interval: 1m0s
  ref:
    branch: main
  secretRef:
    name: claude-remote-auth
  url: ssh://git@github.com/martin-nef/claude-remote.git
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: claude-remote
  namespace: flux-system
spec:
  interval: 10m0s
  path: ./deploy
  prune: true
  sourceRef:
    kind: GitRepository
    name: claude-remote
  decryption:
    provider: sops
    secretRef:
      name: claude-remote-sops-age
  # The agent can open PRs to its own repo, so Flux applies it as an account
  # that can only manage its workload in its namespace; the sandbox itself
  # (RBAC, NetworkPolicy, quota) is nefcloud/claude-remote/ in this repo.
  serviceAccountName: claude-remote-deployer
  targetNamespace: claude-remote
  patches:
    # local-path pins the PVC (and the claude.ai login on it) to the first
    # node the pod lands on: keep that off shitbox and its game servers.
    - target:
        kind: Deployment
        name: claude-remote
      patch: |
        apiVersion: apps/v1
        kind: Deployment
        metadata:
          name: claude-remote
        spec:
          template:
            spec:
              affinity:
                nodeAffinity:
                  preferredDuringSchedulingIgnoredDuringExecution:
                    - weight: 100
                      preference:
                        matchExpressions:
                          - key: kubernetes.io/hostname
                            operator: NotIn
                            values: [shitbox]
