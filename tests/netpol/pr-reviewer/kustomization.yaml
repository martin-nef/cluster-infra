# nefcloud/pr-reviewer/networkpolicy.yaml, from the components. networkpolicy-patch.yaml
# narrows the policies that don't cover every pod.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: pr-reviewer
components:
  - ../../../nefcloud/components/netpol/default-deny
  - ../../../nefcloud/components/netpol/dns
  - ../../../nefcloud/components/netpol/apiserver
  - ../../../nefcloud/components/netpol/internet-https
  - ../../../nefcloud/components/netpol/from-traefik
patches:
  - path: networkpolicy-patch.yaml
