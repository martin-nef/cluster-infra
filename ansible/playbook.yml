---
# This repo is public, so a vault file that is not encrypted is a leaked secret
# (host_vars/oci-small-2 once was). Runs before anything else, whatever the
# tags. It runs once, locally, from `hosts: all`: a `hosts: localhost` play would
# be skipped by `--limit <host>`.
- name: Refuse to run with an unencrypted vault file
  hosts: all
  become: false
  gather_facts: false
  tags: [always]
  tasks:
    - name: Find vault files
      delegate_to: localhost
      run_once: true
      ansible.builtin.find:
        paths: "{{ playbook_dir }}"
        patterns: [vault.yml, vault.yaml]
        recurse: true
      register: vault_files

    - name: Find the encrypted ones
      delegate_to: localhost
      run_once: true
      ansible.builtin.find:
        paths: "{{ playbook_dir }}"
        patterns: [vault.yml, vault.yaml]
        recurse: true
        contains: '^\$ANSIBLE_VAULT;'
      register: vault_files_encrypted

    - name: Fail on unencrypted vault files
      run_once: true
      vars:
        unencrypted: >-
          {{ vault_files.files | map(attribute='path')
             | difference(vault_files_encrypted.files | map(attribute='path')) }}
      ansible.builtin.assert:
        that: unencrypted | length == 0
        fail_msg: "Not encrypted (run ./encrypt.sh, and do not commit them as they are): {{ unencrypted | join(', ') }}"
        quiet: true

- name: Provision cluster nodes
  hosts: all
  become: true
  gather_facts: false
  tags: [base]
  roles:
    - role: base

- name: Clean up dated k3s services
  hosts: all
  become: true
  gather_facts: false
  tags: [k3s]
  tasks:
    - name: Gather service facts
      ansible.builtin.service_facts:

    - name: Remove k3s-agent service from server nodes
      when:
        - "'server' in group_names"
        - ansible_facts.services['k3s-agent.service'] is defined
      ansible.builtin.service:
        name: k3s-agent
        state: stopped
        enabled: false

    - name: Remove k3s server service from agent nodes
      when:
        - "'agent' in group_names"
        - ansible_facts.services['k3s.service'] is defined
      ansible.builtin.service:
        name: k3s
        state: stopped
        enabled: false

# Opt-in only (`--tags k3s`, or `make deploy_k3s`): k3s-ansible restarts k3s on
# the first server on every run and rewrites each node's k3s env file, so it is
# not safe to run on every deploy.
- name: Install k3s cluster
  ansible.builtin.import_playbook: k3s.orchestration.site
  tags: [k3s]
  when: "'k3s' in ansible_run_tags"

- name: Configure k3s registry credentials
  hosts: all
  become: true
  gather_facts: false
  tags: [k3s-registry]
  tasks:
    - name: Ensure k3s config directory exists
      ansible.builtin.file:
        path: /etc/rancher/k3s
        state: directory
        mode: '0755'

    - name: Configure ghcr.io pull credentials
      no_log: true
      ansible.builtin.copy:
        dest: /etc/rancher/k3s/registries.yaml
        mode: '0600'
        content: |
          configs:
            ghcr.io:
              auth:
                username: "{{ vault_ghcr_username }}"
                password: "{{ vault_ghcr_token }}"
      notify: Restart k3s

  handlers:
    - name: Restart k3s
      ansible.builtin.service:
        name: "{{ 'k3s' if 'server' in group_names else 'k3s-agent' }}"
        state: restarted

- name: Install Flux CLI
  hosts: server[0]                     # flux.sh (run from CI) bootstraps Flux and registers apps from here.
  become: true
  gather_facts: false
  tags: [flux]
  roles:
    - role: flux
