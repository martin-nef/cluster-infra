---
- name: Provision cluster nodes
  hosts: all
  become: true
  gather_facts: false
  tags: [base]
  roles:
    - role: base

- name: Clean up dated k3s services
  hosts: all
  become: true
  gather_facts: false
  tags: [k3s]
  tasks:
    - name: Gather service facts
      ansible.builtin.service_facts:

    - name: Remove k3s-agent service from server nodes
      when:
        - "'server' in group_names"
        - ansible_facts.services['k3s-agent.service'] is defined
      ansible.builtin.service:
        name: k3s-agent
        state: stopped
        enabled: false

    - name: Remove k3s server service from agent nodes
      when:
        - "'agent' in group_names"
        - ansible_facts.services['k3s.service'] is defined
      ansible.builtin.service:
        name: k3s
        state: stopped
        enabled: false

- name: Install k3s cluster
  ansible.builtin.import_playbook: k3s.orchestration.site
  tags: [k3s]
  when: "'all' in ansible_run_tags or 'k3s' in ansible_run_tags"

- name: Configure k3s registry credentials
  hosts: all
  become: true
  gather_facts: false
  tags: [k3s-registry]
  tasks:
    - name: Ensure k3s config directory exists
      ansible.builtin.file:
        path: /etc/rancher/k3s
        state: directory
        mode: '0755'

    - name: Configure ghcr.io pull credentials
      no_log: true
      ansible.builtin.copy:
        dest: /etc/rancher/k3s/registries.yaml
        mode: '0600'
        content: |
          configs:
            ghcr.io:
              auth:
                username: "{{ vault_ghcr_username }}"
                password: "{{ vault_ghcr_token }}"
      notify: Restart k3s

  handlers:
    - name: Restart k3s
      ansible.builtin.service:
        name: "{{ 'k3s' if 'server' in group_names else 'k3s-agent' }}"
        state: restarted

- name: Bootstrap Flux
  hosts: server[0]                     # Flux controllers are deployed to the cluster and float across nodes.
  become: true                         # Bootstrap only needs to run once, from the first server.
  gather_facts: false
  tags: [flux]
  roles:
    - role: flux
