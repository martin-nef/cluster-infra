---
# --- Tailscale ---

- name: Check if Tailscale is installed
  ansible.builtin.command: which tailscale
  register: tailscale_installed
  changed_when: false
  failed_when: false
  check_mode: false

- name: Install Tailscale
  ansible.builtin.shell: |
    curl -fsSL https://tailscale.com/install.sh | sh
  when: tailscale_installed.rc != 0

- name: Get Tailscale status
  ansible.builtin.command: tailscale status --json
  register: tailscale_status
  changed_when: false
  failed_when: false
  check_mode: false

- name: Bring Tailscale up
  # Tags are applied by hand at provisioning time, deliberately: advertising them
  # from here would replace a node's whole tag set rather than add to it, and
  # shitbox carries tag:flux-server and tag:shitbox alongside tag:k3s.
  no_log: true
  ansible.builtin.command: >-
    tailscale up
    --auth-key={{ vault_tailscale_auth_key }}
  vars:
    _ts_state: "{{ (tailscale_status.stdout | from_json) if (tailscale_status.rc == 0 and tailscale_status.stdout | default('') | length > 0) else {} }}"
  when: >-
    tailscale_status.rc != 0
    or _ts_state.get('BackendState') != 'Running'

# --- Keep flannel pinned to a live tailscale0 ---
#
# Every tailscaled restart, including the one each Tailscale auto-update does,
# replaces tailscale0, and the kernel deletes flannel.1 (the VXLAN device on top
# of it) along with it. k3s's flannel cannot rebuild it: v1.36.0 looks the
# interface up under an empty name forever ("external interface  not found");
# later releases bundle flannel v0.28.4, whose rebuild panics on IPv4-only
# clusters. Cross-node pod traffic is dead until k3s restarts, so the guard
# below restarts it.

- name: Determine the k3s systemd unit for this node
  ansible.builtin.set_fact:
    k3s_unit: "{{ 'k3s' if 'server' in group_names else 'k3s-agent' }}"

- name: Give each node its turn for guard restarts, gateway first
  # A Tailscale update reaches every node within seconds, so the guard makes the
  # nodes running an etcd member restart k3s one at a time, in this order: the
  # gateway first (it carries all ingress), then the rest in inventory order,
  # 10 s apart. Every node gets a turn; the guard itself decides at run time
  # whether it needs one (only while an etcd member runs on it), so nothing here
  # assumes which nodes those are.
  vars:
    _gateways: >-
      {{ groups['k3s_cluster'] | map('extract', hostvars) | selectattr('gateway', 'defined')
         | selectattr('gateway') | map(attribute='inventory_hostname') | list }}
    _restart_order: "{{ _gateways + (groups['k3s_cluster'] | reject('in', _gateways) | list) }}"
  ansible.builtin.set_fact:
    k3s_restart_stagger: "{{ _restart_order.index(inventory_hostname) * 10 }}"

- name: Create k3s systemd drop-in directory
  ansible.builtin.file:
    path: "/etc/systemd/system/{{ k3s_unit }}.service.d"
    state: directory
    mode: "0755"

- name: Order k3s behind tailscaled and wait for tailscale0 before starting
  # Deliberately no PartOf=tailscaled.service. It would propagate an explicit
  # `systemctl restart tailscaled` through to k3s, but it also propagates a plain
  # `systemctl stop`, which would leave k3s stopped with nothing to start it
  # again. The ifindex guard below covers the restart case without that hazard.
  ansible.builtin.copy:
    dest: "/etc/systemd/system/{{ k3s_unit }}.service.d/10-tailscale.conf"
    mode: "0644"
    content: |
      [Unit]
      After=tailscaled.service
      Wants=tailscaled.service

      [Service]
      ExecStartPre=/bin/sh -c 'for i in $(seq 60); do ip -4 addr show tailscale0 2>/dev/null | grep -q "inet " && exit 0; sleep 2; done; exit 1'
  notify: Reload systemd

- name: Install the tailscale0 ifindex guard script
  # The recovery mechanism: restart k3s when the tailscale0 flannel bound to is
  # replaced, or when flannel.1 is missing while tailscale0 is up. A node running
  # an etcd member waits for its turn first so etcd keeps quorum; see the script.
  # tests/tailscale-flannel-guard.test.sh covers it.
  ansible.builtin.copy:
    src: tailscale-flannel-guard.sh
    dest: /usr/local/bin/tailscale-flannel-guard.sh
    mode: "0755"

- name: Install the tailscale0 ifindex guard service
  # Wanted by tailscale0's device unit, so it also runs the moment tailscaled
  # creates a new tailscale0, not only on the timer's next tick. A oneshot has
  # no start timeout by default; a hung run would block every later one.
  ansible.builtin.copy:
    dest: /etc/systemd/system/tailscale-flannel-guard.service
    mode: "0644"
    content: |
      [Unit]
      Description=Restart {{ k3s_unit }} when tailscale0 is replaced
      After=tailscaled.service

      [Service]
      Type=oneshot
      TimeoutStartSec=15min
      ExecStart=/usr/local/bin/tailscale-flannel-guard.sh {{ k3s_unit }} {{ k3s_restart_stagger }}

      [Install]
      WantedBy=sys-subsystem-net-devices-tailscale0.device
  notify: Reload systemd

- name: Install the tailscale0 ifindex guard timer
  ansible.builtin.copy:
    dest: /etc/systemd/system/tailscale-flannel-guard.timer
    mode: "0644"
    content: |
      [Unit]
      Description=Periodically check whether tailscale0 was replaced

      [Timer]
      OnBootSec=60
      OnUnitActiveSec=30
      AccuracySec=5

      [Install]
      WantedBy=timers.target
  notify: Reload systemd

- name: Flush systemd handlers before enabling the guard units
  ansible.builtin.meta: flush_handlers

- name: Enable the tailscale0 ifindex guard timer
  # Skipped under --check: the unit file above is not actually written in check
  # mode, so systemd cannot find the timer to enable.
  when: not ansible_check_mode
  ansible.builtin.systemd:
    name: tailscale-flannel-guard.timer
    enabled: true
    state: started

- name: Run the guard whenever tailscale0 is created
  # Enabling links the service into tailscale0's device unit; it is not started
  # here. Skipped under --check for the same reason as the timer.
  when: not ansible_check_mode
  ansible.builtin.systemd:
    name: tailscale-flannel-guard.service
    enabled: true

