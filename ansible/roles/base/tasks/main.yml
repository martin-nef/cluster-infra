# --- Unattended upgrades ---

- name: Install unattended-upgrades
  ansible.builtin.apt:
    name: unattended-upgrades
    state: present

- name: Enable automatic security updates
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    mode: "0644"
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";

- name: Create apt-daily systemd drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/system/apt-daily.service.d
    state: directory
    mode: "0755"

- name: Bound how long the daily apt list refresh may run
  # apt-daily.service is a oneshot with no start timeout. On oci-big-1 its
  # `apt-get update` hung on 2026-06-06 and held the apt lists lock for four
  # months, which silently stopped unattended-upgrades and every Tailscale
  # auto-update, as both need that lock. Only the list refresh is bounded:
  # apt-daily-upgrade.service runs dpkg, which must not be killed mid-install.
  # The timeout counts from when a run started, so on a node that is already
  # stuck the daemon-reload this triggers ends the stuck run straight away.
  ansible.builtin.copy:
    dest: /etc/systemd/system/apt-daily.service.d/10-timeout.conf
    mode: "0644"
    content: |
      # Managed by Ansible (roles/base).
      [Service]
      TimeoutStartSec=30min
  notify: Reload systemd
