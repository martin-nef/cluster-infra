name: yamllint

# Lints the YAML files a PR adds or changes with yamllint. Rules and exclusions
# live in .yamllint.yml (`ignore:`), which also applies to files named
# explicitly, so excluding something there is all it takes.
on:
  pull_request:
    paths:
      - "**.yml"
      - "**.yaml"
      - .yamllint.yml

permissions:
  contents: read

concurrency:
  group: yamllint-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  YAMLLINT_VERSION: 1.38.0

jobs:
  yamllint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install yamllint
        run: pipx install "yamllint==$YAMLLINT_VERSION"

      # Only files that exist after the PR (A/C/M/R), so deletions are ignored.
      - name: Lint changed files
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git diff --name-only -z --diff-filter=ACMR "origin/$BASE_REF...HEAD" -- '*.yml' '*.yaml' > changed.txt
          if [ ! -s changed.txt ]; then
            echo "no yaml files changed"
            exit 0
          fi
          xargs -0 yamllint --format github < changed.txt
