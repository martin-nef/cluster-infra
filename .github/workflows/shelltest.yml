name: shelltest

# Runs the shell test suites on PRs that touch a tested script or the tests:
# tests/flux-helm.test.sh (flux-helm.sh, against throwaway local repos with a
# stubbed gh) and tests/tailscale-flannel-guard.test.sh (the k3s restart guard
# from roles/base, against a fake /sys and stubbed systemctl). Neither needs
# secrets and nothing leaves the runner. Both run under dash (sh on Ubuntu) and
# bash, since the scripts have to work in both.
on:
  pull_request:
    paths:
      - flux-helm.sh
      - ansible/roles/base/files/tailscale-flannel-guard.sh
      - tests/**
      - .github/workflows/shelltest.yml

permissions:
  contents: read

concurrency:
  group: shelltest-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  # Same version as flux-helm.yml, which the generated manifests depend on.
  FLUX_VERSION: 2.8.6

jobs:
  shelltest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shell: [sh, bash]
    steps:
      - uses: actions/checkout@v7

      - uses: fluxcd/flux2/action@04acaec6161ac4fb1a82ffafa88901c03271d34f  # v2.8.6
        with:
          version: ${{ env.FLUX_VERSION }}

      # kubectl and perl come with the runner image, so no check is skipped.
      - name: Run flux-helm tests
        run: tests/flux-helm.test.sh "${{ matrix.shell }}"

      # Runs even if the flux-helm tests failed, so both results show.
      - name: Run tailscale-flannel-guard tests
        if: ${{ !cancelled() }}
        run: tests/tailscale-flannel-guard.test.sh "${{ matrix.shell }}"
