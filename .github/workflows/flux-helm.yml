name: Flux Helm

on:
  push:
    branches:
      - main
    paths:
      - nefcloud/*/helm
      - nefcloud/*/values*.yaml
      - flux-helm.sh
      - .github/workflows/flux-helm.yml
  workflow_dispatch:

concurrency:
  group: Flux Helm
  cancel-in-progress: false

permissions:
  contents: read

env:
  # The flux CLI renders the manifests, so its version decides their apiVersions
  # and layout. Keep it equal to the controllers in
  # nefcloud/flux-system/gotk-components.yaml; flux-helm.sh fails on a mismatch.
  FLUX_VERSION: 2.8.6

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: fluxcd/flux2/action@04acaec6161ac4fb1a82ffafa88901c03271d34f  # v2.8.6
        with:
          version: ${{ env.FLUX_VERSION }}

      # Needs neither the cluster nor the tailnet: it renders manifests from the
      # helm files and talks to GitHub. The token is a PAT rather than the
      # default GITHUB_TOKEN so that the PR it opens still triggers Flux Check
      # (events created with the default token do not start other workflows).
      - name: Run flux-helm.sh
        env:
          GITHUB_TOKEN: ${{ secrets.FLUX_GITHUB_TOKEN }}
        run: ./flux-helm.sh
