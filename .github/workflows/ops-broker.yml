name: ops-broker

# Runs the ops broker's unit tests (nefcloud/ops-broker/broker/test_*.py) on
# PRs that touch the broker. Stdlib only: the Kubernetes and GitHub APIs are
# faked in memory, so no secrets are needed and nothing leaves the runner.
# The Python version matches the broker's image in deployment.yaml. The runner's
# openssl CLI lets test_minter.py compare its signatures against openssl.
on:
  pull_request:
    paths:
      - nefcloud/ops-broker/**
      - .github/workflows/ops-broker.yml

permissions:
  contents: read

concurrency:
  group: ops-broker-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Run the broker tests
        working-directory: nefcloud/ops-broker/broker
        run: python3 -I -m unittest -v
